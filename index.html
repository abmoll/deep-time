const STORY={"Big Bang":{"possible":"The laws of physics allowed an extremely hot, dense beginning, after which space itself could expand and cool.","before":"There was no space, time, or matter as we know them — only a state hotter and denser than anything that would follow.","after":"In a fraction of a second the universe inflated, then cooled enough for the first particles, light, and, much later, atoms to form."},"First stars":{"possible":"Gravity gathered slight ripples in the primordial hydrogen and helium into collapsing clouds, until their cores grew hot enough for nuclear fusion.","before":"The young universe was a cooling fog of hydrogen and helium, still without starlight.","after":"The first stars lit the cosmos and began forging the heavier elements that later worlds would need."},"Milky Way forms":{"possible":"Gravity pulled gas, dark matter, and generations of early stars into a growing overdensity in what would become the Local Group.","before":"Only diffuse gas and early stars drifted in a still-settling cosmos, with no large galaxy like ours yet in place.","after":"Those first building blocks grew into the Milky Way, the galaxy in which the Sun and Earth would later form."},"First supernovae":{"possible":"The first stars were massive and short-lived; when they exhausted their fuel, their cores collapsed and exploded at temperatures that could forge elements heavier than helium.","before":"The cosmos held almost nothing but hydrogen and helium; the gas around the first stars had not yet been seeded with carbon, oxygen, or iron.","after":"Heavy elements were scattered into space, the raw material for later stars, planets, and life."},"First galaxies":{"possible":"Dark matter and gravity pulled gas and stars into the collapsing overdensities left over from the early universe.","before":"Stars had begun to shine, but they were still scattered, not yet gathered into the great star cities we call galaxies.","after":"Galaxies became the main arenas of star formation and would merge and grow for billions of years."},"Reionization":{"possible":"Cumulative ultraviolet light from early stars and galaxies stripped electrons from the neutral hydrogen that filled intergalactic space.","before":"After the first atoms formed, the universe entered a long dark age in which intergalactic hydrogen remained neutral and opaque to many wavelengths of light.","after":"The space between the galaxies became transparent, and the universe took on the ionized, observable form we see today."},"Andromeda forms":{"possible":"The same gravitational gathering of gas, dark matter, and stars that built the young Milky Way was at work in a neighboring overdensity.","before":"The early universe was already growing small galaxies, including the ancestors of our own, still far from today's grand spirals.","after":"Andromeda grew into the Local Group's largest galaxy and is now on a slow collision course with the Milky Way."},"Peak star formation":{"possible":"Abundant cold gas, frequent galaxy mergers, and maturing galaxies created ideal conditions for a universal burst of star birth.","before":"For billions of years galaxies had been forming and colliding, with star formation still rising as gas supplies remained rich.","after":"From this peak onward, cosmic star formation slowly declined as gas was used up or heated, shaping the quieter universe we inhabit."},"Sun forms":{"possible":"A nearby shock — perhaps from a supernova — helped a cold, metal-enriched molecular cloud collapse under gravity, until a dense core ignited fusion.","before":"A dark cloud of gas and dust, already seeded with heavy elements from earlier stars, drifted in a spiral arm of the Milky Way.","after":"The newborn Sun lit a surrounding disk of gas and dust in which the planets, including Earth, would soon take shape."},"Earth forms":{"possible":"In the protoplanetary disk around the young Sun, dust stuck together and grew into planetesimals that accreted under gravity.","before":"A swirling disk of leftover gas, ice, and rock circled the infant Sun, still without a finished Earth.","after":"A warm, molten proto-Earth took shape, setting the stage for the Moon-forming impact and a long geologic history."},"The Moon forms":{"possible":"A Mars-sized protoplanet, Theia, shared the inner solar system and was on a collision course with the growing Earth.","before":"The young Earth was already taking shape, but it had no large moon and was still being battered by leftover planetary bodies.","after":"The impact remade Earth's spin and interior, and the debris coalesced into the Moon, which still stabilizes our planet's tilt and tides."},"Oldest zircons":{"possible":"As local pockets of crust cooled, zirconium-rich melts crystallized into durable zircon grains tough enough to survive later reworking.","before":"Earth's earliest crust was repeatedly melted and recast; almost no original surface has survived.","after":"Those crystals preserve the oldest direct dates we have for Earth's crust and hint that liquid water may already have been present."},"First oceans":{"possible":"As the surface cooled and a steam atmosphere condensed, water from the planet's interior and from icy impactors could pool in basins.","before":"The newborn Earth was a hot world of magma and steam, too warm for lasting seas.","after":"Oceans became the setting for chemistry that would, in time, give rise to life, and they have shaped climate and geology ever since."},"Late Heavy Bombardment":{"possible":"A rearrangement of the giant planets is thought to have sent a storm of leftover asteroids and comets into the inner solar system.","before":"The inner planets had formed, but leftover debris and shifting giant-planet orbits still made the solar system a shooting gallery.","after":"The Moon's great basins were carved and Earth was heavily resurfaced; whether this helped or hindered early life remains debated."},"Great Oxygenation":{"possible":"Cyanobacteria had evolved oxygenic photosynthesis and, over immense stretches of time, pumped oxygen into seas and sky faster than rocks and iron could absorb it.","before":"Earth's air was almost oxygen-free; microbial life had long existed, but the atmosphere would have been hostile to later animals.","after":"The air and oceans turned oxidizing, many anaerobic microbes were pushed aside, and an oxygen-rich world made complex life possible — after a long delay."},"Rodinia":{"possible":"Plate tectonics drove ancient cratons together in a long series of collisions.","before":"Earth's continents were scattered; no single landmass yet grouped most of the planet's crust.","after":"The assembled supercontinent altered ocean circulation and climate, and its later breakup helped reshape the world in which animals would eventually appear."},"Snowball Earth":{"possible":"Weathering of silicate rock, a changing arrangement of continents, and ice-albedo feedback let ice advance from the poles until it could reach the tropics.","before":"The continents sat in a configuration that left a cooling climate exposed to runaway glaciation.","after":"Repeated global freezes stressed life and, when the ice finally retreated, may have opened new ecological opportunities for early animals."},"Pangaea":{"possible":"Plate collisions, including the joining of Gondwana and Laurussia, sutured Earth's landmasses into one.","before":"During the late Paleozoic, separate continental blocks still ringed a closing ocean.","after":"Pangaea's vast interior grew arid, ocean circulation changed, and its later breakup would create the Atlantic and the continents we know."},"Himalayas begin":{"possible":"The northward motion of the Indian plate, driven by mantle convection, brought it into a collision with Eurasia.","before":"India was an island continent rafting north across the Tethys after leaving Gondwana; the Himalayas did not yet exist.","after":"The rising Himalayas and Tibetan Plateau remade Asian climate, strengthened the monsoons, and continue to grow and erode today."},"First life":{"possible":"In warm, chemistry-rich settings — hydrothermal vents, tide pools, or mineral surfaces — molecules could assemble into self-replicating, membrane-bound systems.","before":"Earth had oceans, organics, and energy, but no known living cells.","after":"Life, once started, spread through the seas and began to alter the planet itself."},"Stromatolites":{"possible":"Communities of microbes, including early photosynthetic bacteria, trapped and bound sediment in shallow water, layer upon layer.","before":"Microbes had already taken hold, but they left few durable structures in the rock record.","after":"Stromatolites became some of the oldest clear fossils of life and, in living form, still grow in a few protected waters today."},"Eukaryotes":{"possible":"In an increasingly oxygenated world, one cell engulfed another — most likely an archaeon taking in a bacterium — and the partnership became the mitochondrion.","before":"For well over a billion years, life was prokaryotic: cells without a nucleus or internal organelles.","after":"Eukaryotic cells could grow larger and more complex, and they later gave rise to plants, animals, fungi, and every organism with a nucleus."},"Multicellular life":{"possible":"Cells that stayed attached after division, and began to specialize, could form simple tissues — a path taken early by red algae such as Bangiomorpha.","before":"Eukaryotic cells lived as single individuals; nothing like a true plant or animal body yet existed.","after":"Multicellularity opened the way to larger bodies, organs, and, eventually, the visible living world."},"Ediacaran biota":{"possible":"A milder climate after Snowball Earth, more available oxygen, and evolving animal lineages allowed larger, soft-bodied organisms to take form.","before":"The seas were still dominated by microbes and simple algae; large animals had not yet left a clear mark.","after":"These strange early animals foreshadowed the burst of body plans that would follow in the Cambrian."},"Cambrian explosion":{"possible":"Genetic toolkits for building bodies, rising oxygen, and new ecological arms races favored rapid experimentation in form.","before":"Ocean life was real but relatively sparse in hard shells and familiar body plans; the Ediacaran world was already fading.","after":"Most of the major animal phyla appeared in the fossil record, and seas filled with predators, prey, and mineralized skeletons."},"First vertebrates":{"possible":"A notochord and then a vertebral column gave swimming animals a stiff, flexible support — an advantage in open water.","before":"Early Cambrian animals included arthropods and many soft-bodied forms, but none yet had a backbone.","after":"Those jawless fishes founded the vertebrate line that would later include sharks, tetrapods, and humans."},"First land plants":{"possible":"Freshwater green algae evolved ways to resist drying, including cuticle-like coatings and spores, and could colonize damp shores.","before":"Continents were bare rock, dust, and microbial films; plants lived only in water.","after":"Vegetation slowly greened the land, built soils, and set the stage for animals to follow."},"First tetrapods":{"possible":"Lobe-finned fishes in shallow, plant-choked waters evolved sturdy, jointed fins and lungs that could support brief trips into air and mud.","before":"Vertebrates were still aquatic; fins and gills were the rule, and dry land belonged to plants and arthropods.","after":"Tetrapods inherited the continents, and their descendants became amphibians, reptiles, birds, and mammals."},"Great Dying":{"possible":"Massive eruptions of the Siberian Traps poured out lava, greenhouse gases, and toxins, driving climate and ocean chemistry into collapse.","before":"The late Permian world was already stressed by a warming, oxygen-poor climate, with life still abundant on land and in the seas.","after":"Most species vanished; ecosystems had to be rebuilt from survivors, and the emptied world that followed made room for dinosaurs and, later, mammals."},"First dinosaurs":{"possible":"Archosaur reptiles evolved upright limbs and new ways of moving and feeding in the open landscapes left after the Great Dying.","before":"The early Triassic was a recovering world of modest reptiles and emptied niches on land.","after":"Dinosaurs spread, diversified, and for more than 150 million years were the dominant large animals on land."},"First mammals":{"possible":"Small cynodonts evolved differentiated teeth, warmer physiology, and jaws that would become the middle ear — traits of true mammals.","before":"The ancestors of mammals were still synapsid forerunners, sharing a Triassic world in which dinosaurs were on the rise.","after":"Early mammals stayed mostly small and nocturnal through the dinosaur age, then radiated once the dinosaurs were gone."},"First flowering plants":{"possible":"A new plant lineage evolved flowers and, with them, more efficient reproduction and partnerships with pollinating insects.","before":"Mesozoic landscapes were already green with ferns, conifers, and cycads, but there were no flowers and no flowering fruits.","after":"Angiosperms transformed forests, grasslands, and food webs, and today they dominate most terrestrial plant life."},"Dinosaur extinction":{"possible":"A massive asteroid struck what is now the Yucatán, and the fires, darkness, and climate shock that followed were fatal to most large species.","before":"Dinosaurs still ruled the land, and a rich Late Cretaceous world of plants, animals, and shallow seas seemed stable.","after":"Non-avian dinosaurs were gone; mammals, birds, and a reshaped biosphere inherited the world."},"First primates":{"possible":"Small, tree- and insect-oriented mammals already had grasping hands, forward-facing eyes, and flexible brains — a starting kit for primates.","before":"The post-impact world was open and warming, with many daytime niches vacated by dinosaurs.","after":"Primates spread through the forests and, much later, one African branch would lead to the hominins."},"First hominins":{"possible":"Climate swings that fragmented African forests, and an ape ancestry with flexible shoulders and grasping hands, favored experiments in mixed woodland walking.","before":"African forests were home to apes, but no species yet walked habitually upright or stood on the human line.","after":"The hominin lineage split from other apes and began the long path toward upright walking, tools, and, eventually, our species."},"Australopithecus afarensis":{"possible":"A changing mosaic of woodland and savanna in East Africa favored creatures that could walk on two legs and still climb.","before":"Earlier apes and the first hominins had begun to walk more upright, but this best-known bipedal species of East Africa had not yet appeared.","after":"Australopithecus afarensis and its kin show that upright walking was well established millions of years before large brains or stone tools."},"Laetoli footprints":{"possible":"A volcanic eruption laid down a wet ash layer on the East African landscape, and hominins walked across it before it hardened.","before":"Bipedal walking had been inferred from bones, but a living stride had not yet been caught so clearly in the act.","after":"The preserved tracks remain among the most vivid proof that our ancestors walked upright by 3.66 million years ago."},"First stone tools":{"possible":"Hands freed from walking, and the need to process food, led some hominins to strike stone on stone at Lomekwi in Kenya.","before":"Hominins walked upright and used found objects, but regular toolmaking had not yet left a clear stone record.","after":"A technological path began that would lead, through later industries, to all human-made tools."},"Lucy":{"possible":"A species already adapted to bipedal life on the ground, yet still at home in trees, could thrive in Ethiopia's changing mosaic habitats.","before":"East African woodlands and grasslands were already walked by Australopithecus afarensis, a small-bodied, upright hominin.","after":"Fossils like Lucy's later let us see that body plan in detail; her kind lived on for a time and shared the landscape with later toolmakers."},"Genus Homo emerges":{"possible":"Environmental change and a shift toward more tool use, meat, and brain growth produced a slightly larger-brained, more versatile lineage.","before":"The African hominin family included australopiths with small brains and ape-like faces, but not yet the genus we place ourselves in.","after":"Homo would spread across and then out of Africa, giving rise to erectus, sapiens, and our extinct cousins."},"Oldowan tools":{"possible":"Early Homo and late australopiths learned to strike sharp flakes from pebble cores, a simple recipe that could be taught and repeated.","before":"The rare Lomekwi tools already existed, but a lasting, widespread stone-tool culture had not yet taken hold.","after":"Oldowan tools spread widely in Africa and let hominins butcher meat, crack bone, and process plants more efficiently."},"Homo habilis":{"possible":"A diet that included more meat and marrow, plus routine stone-tool use, favored individuals with greater dexterity and brain size.","before":"Early Homo was just emerging; a distinctly handy, larger-brained species was not yet clearly present in the record.","after":"Homo habilis and its close kin show the first well-known pairing of a bigger brain with everyday tool use, a step toward later Homo."},"Homo erectus":{"possible":"A commitment to long-distance walking and running, larger bodies, and bigger brains evolved in African populations that relied more on tools and meat.","before":"Earlier Homo and australopiths were still relatively small-bodied, with climbing-ready proportions and limited range.","after":"Homo erectus could range widely, and would become the first human species to leave Africa and persist for well over a million years."},"First out of Africa":{"possible":"Homo erectus had the legs, tools, and flexibility to follow game and new habitats out of Africa and across the Levant into Eurasia.","before":"All earlier human evolution had unfolded in Africa; the rest of the Old World had no people.","after":"Humans became a multi-continental genus, reaching the Caucasus, East Asia, and eventually Java."},"Acheulean hand axes":{"possible":"Toolmakers learned to flake both sides of a stone into a teardrop hand axe, a plan they could repeat with skill.","before":"Oldowan tools were simple flakes and cores, effective but rarely shaped into a standard form.","after":"The Acheulean spread for more than a million years and became a hallmark of Homo erectus technology."},"Controlled fire":{"possible":"Repeated use of hearths — as hinted at Wonderwerk Cave and later sites — let some groups capture, tend, and finally make fire.","before":"Hominins almost certainly met natural wildfires, but they had not yet been shown to keep or kindle fire at will.","after":"Fire gave warmth, protection, light, and cooked food, opening new diets, climates, and social hours after dark."},"Homo heidelbergensis":{"possible":"African and Eurasian populations of later Homo evolved larger brains and more modern skeletons, often grouped as Homo heidelbergensis or close kin.","before":"Homo erectus had long been the main human of the Old World; the ancestors of sapiens and Neanderthals were not yet a distinct later form.","after":"This paleospecies is widely seen as the shared root from which modern humans, Neanderthals, and Denisovans later split."},"Neanderthals and Denisovans":{"possible":"Groups that moved into colder Eurasia became isolated enough, over many thousands of years, to follow their own evolutionary paths.","before":"A widespread late-Homo population still formed a loosely connected family; Neanderthals and Denisovans did not yet exist as separate peoples.","after":"Neanderthals would inhabit Europe and western Asia, Denisovans the east, and both would later meet — and mix with — incoming Homo sapiens."},"Homo sapiens":{"possible":"In African populations with large brains and increasingly modern skeletons, anatomy we recognize as our own gradually took shape.","before":"Africa was home to earlier forms of Homo with more robust faces and somewhat smaller brains, but not yet to people like us.","after":"Homo sapiens would, in time, spread across the world and become the last surviving human species."},"Out of Africa":{"possible":"A later African population, carrying new skills and perhaps benefiting from climate windows, expanded through the Near East and along the southern coasts of Asia.","before":"Modern humans had lived in Africa for well over 100,000 years, with only limited earlier forays beyond it; much of the globe was still without us.","after":"Their descendants peopled Eurasia, Australia, and eventually the Americas, meeting Neanderthals and Denisovans along the way."},"Cave art":{"possible":"Fully modern minds, mineral pigments, lamps or firelight, and the shelter of caves allowed artists in Europe and Southeast Asia to fix images of animals and signs in place.","before":"People already made tools, ornaments, and almost certainly music and stories, but little painted imagery had yet been left on cave walls.","after":"Cave art remains some of the earliest surviving windows into human imagination and symbolic life."},"Lascaux":{"possible":"Magdalenian communities in the Dordogne had the skill, pigments, and social or ritual reasons to decorate deep chambers of a limestone cave.","before":"Ice Age Europe already had a tradition of cave painting, from earlier sites such as Chauvet, but the halls of Lascaux itself had not yet been made.","after":"The Hall of the Bulls and its companions became, many thousands of years later, among the most famous images of the Paleolithic world."},"First Humans in the Americas":{"possible":"Lowered sea levels exposed the Bering land bridge, and people already living in Siberia could move east, then south along the coast or through gaps in the ice.","before":"The Americas were still without people, cut off by ice and ocean from the peopled Old World.","after":"Within a few thousand years humans had spread through North and South America, founding all later Indigenous societies of the continents."},"Dogs domesticated":{"possible":"Tamer wolves that hung around human camps, or pups raised by hunters, were gradually selected for closeness to people.","before":"People hunted, scavenged, and sometimes shared landscapes with wolves, but no animal yet lived as a true companion.","after":"The dog became the first domesticated animal — a partner in hunting, protection, and, much later, herding and friendship."},"End of the Ice Age":{"possible":"Changes in Earth's orbit and rising greenhouse gases brought a sustained warming that the great ice sheets could not survive.","before":"For tens of thousands of years, ice covered much of the north, and climate swung in the harsh rhythms of the Pleistocene.","after":"The Holocene's relatively stable warmth opened the way for farming, villages, and the civilizations that followed."},"Göbekli Tepe":{"possible":"A rich, post-glacial landscape of wild cereals and game could support large seasonal gatherings, and skilled stone-carvers could raise T-shaped pillars in circles.","before":"People in the Fertile Crescent were still hunter-gatherers; they had not yet become farmers, yet they were already capable of ambitious gatherings.","after":"Göbekli Tepe shows that monumental ritual architecture could precede village farming, upending older stories of how civilization began."},"First farming":{"possible":"In the Fertile Crescent, naturally large-seeded grasses, a warming Holocene climate, and communities already settling part of the year made deliberate cultivation worthwhile.","before":"People gathered wild wheat and barley but did not yet depend on sowing and harvest; food came from hunting and foraging.","after":"Agriculture would spread and be invented elsewhere, supporting denser populations, stored food, and, in time, cities."},"Goats and sheep domesticated":{"possible":"Wild goats and sheep in the Zagros and nearby highlands were social enough to be managed, and settled farmers had reason to keep a reliable meat supply nearby.","before":"Early cultivators still relied heavily on hunted game; no herd animals yet lived under human control.","after":"Livestock became a second pillar of farming life, giving meat, milk, hides, and later wool."},"Jericho's walls":{"possible":"A productive oasis, a growing population, and perhaps a need for defense or ritual display made a massive stone wall and tower worth the labor.","before":"Some communities in the Jordan Valley were already settling year-round, but they had not yet enclosed a town with a great wall and tower.","after":"Jericho stands among the first permanent towns, a sign that village life was becoming truly fixed in place."},"Rice farming":{"possible":"Wild rice naturally grew in the Yangtze basin, and communities that already used pottery and settled near water could begin planting and selecting it.","before":"In the Yangtze basin, people foraged wild rice and other wetland plants, without a fully agricultural way of life.","after":"Rice farming spread through East and Southeast Asia and became one of the world's great food foundations."},"Maize domesticated":{"possible":"Over many generations, cultivators in Mexico selected teosinte for larger cobs and kernels until it became maize.","before":"In Mesoamerica, people hunted and gathered, including wild teosinte, a grassy plant with only tiny ears.","after":"Maize spread across the Americas and, much later, the world, becoming a staple that could support cities and states."},"Horses and the plow":{"possible":"Wild horses of the Eurasian steppe could be tamed for riding and draft, while heavier plows turned more soil than a hoe could manage.","before":"Farming was already established in the Near East, but fields were still worked by hand and transport depended on human or ox power, not the horse.","after":"The plow expanded farmland, and the horse would later remake travel, herding, and warfare across Eurasia."},"Uruk":{"possible":"Irrigation agriculture on the Euphrates, growing trade, and temple administration could support a dense population and specialist crafts.","before":"Mesopotamia had villages and temples, but no settlement yet reached the scale or complexity of a true city.","after":"Uruk became a model of urban life — writing, monumental building, and the state would soon follow in its wake."},"Cuneiform writing":{"possible":"Temple and palace economies in Mesopotamia needed a way to track grain, labor, and offerings, and accountants pressed signs into clay.","before":"Accounts and memory were oral, and tokens or seals could mark goods, but no true writing system yet recorded language.","after":"Cuneiform grew from bookkeeping into a full script for law, letters, literature, and history — the beginning of the written record."},"Egypt unified":{"possible":"A shared river, growing trade, and ambitious rulers in the south provided the means to conquer and then administer the whole Nile Valley.","before":"The Nile Valley held distinct cultures in Upper and Lower Egypt, not yet a single kingdom.","after":"The pharaonic state would last, in changing forms, for three millennia and leave the temples, tombs, and writing of ancient Egypt."},"Bronze Age":{"possible":"Smiths learned that copper alloyed with tin made a harder, more useful metal, and trade could bring the two together.","before":"Tools and weapons were still of stone, copper, or wood; metal was known but soft.","after":"Bronze armed and equipped palaces and armies, and the Bronze Age economies of the Near East and Mediterranean grew more connected — and more fragile."},"Great Pyramid of Giza":{"possible":"A centralized state, surplus grain, skilled organizers, and generations of practice in stone building made a 146-meter royal tomb achievable.","before":"Egypt's Old Kingdom already built large tombs, but nothing on Earth had yet reached the scale of Khufu's pyramid.","after":"The Great Pyramid stood as the ancient world's most massive monument and remains the defining emblem of Old Kingdom power."},"First burials":{"possible":"Modern humans, and perhaps earlier kin, with symbolic minds began to place the dead in prepared graves, sometimes with ochre and offerings, at sites such as Qafzeh and Skhul.","before":"People cared for the dead and sometimes cached bodies, but clear, repeated burial with grave goods was not yet well attested.","after":"Burial became a widespread human practice, a mark of ritual, memory, and beliefs about death."},"Shell beads":{"possible":"In southern Africa, groups at sites such as Blombos Cave collected tick shells, pierced them, and strung them as beads.","before":"People already used ochre and tools, but durable personal ornaments were still rare in the archaeological record.","after":"Jewelry and other ornaments spread as some of the earliest clear signs of identity, status, and symbolic culture."},"Toba eruption":{"possible":"The Toba volcano's huge magma chamber erupted in a catastrophic explosion, sending ash across much of the tropics.","before":"People and other hominins were already widespread in Africa and Eurasia, living through ordinary climate swings, not a super-eruption.","after":"A volcanic winter followed; how badly it reduced human populations is still debated, but the ash remains a global time marker."},"Neanderthal extinction":{"possible":"A mix of climate stress, small population sizes, and competition or absorption by expanding modern humans likely drove Neanderthals to the edge.","before":"For hundreds of thousands of years, Neanderthals had shared Eurasia with other humans and, late on, with incoming Homo sapiens.","after":"Their distinctive fossils cease; our species remained, carrying a little Neanderthal DNA in people outside Africa."},"First pottery":{"possible":"East Asian hunter-gatherers, living in a resource-rich but cold late Pleistocene, discovered that clay hardened in fire into waterproof containers.","before":"People cooked in pits and skins and had no fired clay vessels in the archaeological record.","after":"Pottery spread, much later becoming essential to farming life for storage, cooking, and fermentation."},"The wheel":{"possible":"Mesopotamian potters developed the fast-spinning wheel, and the same idea of a rotating disk was soon applied to carts.","before":"Heavy loads were dragged, carried, or floated; potters shaped clay by hand, and no wheeled vehicle yet existed.","after":"Wheeled transport and the potter's wheel spread, remaking crafts, trade, and, with draft animals, overland travel."},"Code of Hammurabi":{"possible":"A strong Babylonian king, a mature cuneiform legal tradition, and the wish to display justice led Hammurabi to inscribe his judgments in stone.","before":"Mesopotamian cities already had kings and customs, but no comparably complete written law code had yet been set up as a public monument.","after":"The code influenced how later societies thought about law, and it remains a foundational document of legal history."},"Iron Age":{"possible":"Smiths learned to smelt and work iron, a far more common ore than tin-rich bronze, especially as Bronze Age palace systems in the eastern Mediterranean came under stress.","before":"Bronze still dominated elite weapons and tools, but the metal depended on scarce tin and specialized trade.","after":"Iron tools and weapons spread widely, arming new states and putting metal into more hands than bronze ever had."},"Athenian democracy":{"possible":"Crisis, reform-minded leaders, and a culture of public debate allowed Cleisthenes to reorganize the citizenry into a system of assemblies and offices.","before":"Athens was an aristocratic city-state, with power in the hands of noble families rather than a broad citizen body.","after":"Athenian democracy, however limited by modern standards, became a reference point for later republican and democratic thought."},"Alexander the Great":{"possible":"Philip and Alexander's professional army, cavalry, and siegecraft, plus the exhaustion of Persia, made a lightning conquest possible.","before":"The Persian Empire stretched from the Aegean to India, and the Greek world was a patchwork of city-states, with Macedon newly dominant among them.","after":"Greek language and culture spread across the Near East in the Hellenistic age, a mix that would shape the Mediterranean for centuries."},"Silk Road":{"possible":"After the Han dynasty pushed into Central Asia, caravans could move more securely across the oases, carrying silk, horses, and ideas.","before":"China, Central Asia, India, and the Mediterranean traded only in stages, with no regular corridor recently opened from the east.","after":"The Silk Road linked East and West for centuries, spreading goods, technologies, religions, and disease."},"Birth of Jesus":{"possible":"A Jewish world of scripture, prophecy, and messianic hope, already in contact with Greek and Roman culture, was the setting in which Jesus was born and later taught.","before":"Judea was a Roman client region of Second Temple Judaism; a small Jewish population lived under imperial power, and the movement later called Christianity did not yet exist.","after":"His life, crucifixion, and the movement of his followers grew into Christianity, which would become the world's largest religion and remake much of global history."},"Birth of Islam":{"possible":"Muhammad, a merchant of Mecca, experienced a call to prophesy in a society already familiar with monotheism through Judaism and Christianity.","before":"Arabia was a land of trading towns, desert tribes, and older religions; the community of Muslims did not yet exist.","after":"Islam unified much of Arabia and, within a century, spread into a civilization stretching from Spain to Central Asia."},"Mongol Empire":{"possible":"Temüjin united the Mongol tribes by alliance and force, then applied unmatched cavalry, discipline, and terror to neighbors already divided.","before":"The Eurasian steppe held rival nomad tribes; no single Mongol power yet spanned the grasslands, let alone the continents.","after":"The Mongol Empire, later the largest contiguous land empire, connected Eurasia under a peace that was both brutal and, for a time, open to trade."},"Roman Empire":{"possible":"Victory over Antony and Cleopatra, control of the army, and a careful restoration of republican forms let Octavian accept the title Augustus in 27 BCE.","before":"Rome had been a republic battered by civil war; Octavian held power in fact, but the old forms had not yet become an empire in name.","after":"The Roman Empire would dominate the Mediterranean for centuries, and its law, language, and cities shaped Europe, North Africa, and the Near East long after the West fell in 476."},"Magna Carta":{"possible":"Military failure, heavy taxation, and organized baronial resistance forced King John to negotiate at Runnymede.","before":"English kings claimed broad, often arbitrary power, and a losing, overreaching King John faced angry barons with no great charter to bind him.","after":"Magna Carta's ideas — that the king was under the law, and that no free man should be punished except by lawful judgment — echoed into later constitutional government."},"Black Death":{"possible":"Yersinia pestis, carried by fleas on rodents, traveled along Mongol-era trade routes from Central Asia into Mediterranean ports.","before":"Europe was populous and commercially revived, but already weakened in places by a climate downturn and earlier disease; it had not yet met this plague.","after":"Perhaps a third of Europeans died; labor grew scarce, social bonds strained, and the shock helped remake medieval economy and religion."},"Printing press":{"possible":"Gutenberg combined movable metal type, a press adapted from existing screw presses, oil-based ink, and a ready market for cheaper texts in mid-15th-century Germany.","before":"Books were copied by hand, rare and expensive, and literacy was largely confined to clergy, clerks, and elites.","after":"Printed books multiplied, spreading literacy, Reformation, science, and news, and making mass communication possible."},"Columbus reaches the Americas":{"possible":"Iberian advances in ships and navigation, a search for a westward route to Asia, and royal backing in Spain sent Columbus across the Atlantic.","before":"The Americas had been home to Indigenous peoples for thousands of years, but they remained unknown to late-medieval Europe; Atlantic voyages had not yet made a lasting crossing to the Caribbean.","after":"His landfall opened a permanent, often catastrophic, encounter between the Old World and the New — the Columbian Exchange of people, crops, silver, and disease."},"Scientific Revolution":{"possible":"Better observations, recovered ancient texts, and a mathematician-astronomer willing to put the Sun at the center led Copernicus to publish his model in 1543.","before":"European learning still rested largely on ancient authority; the Earth was widely placed at the center of a nested cosmos.","after":"A new habit of questioning nature by mathematics and observation gathered force, and the Scientific Revolution followed."},"Newton's Principia":{"possible":"Newton's invention of a new mathematics, and his synthesis of Kepler's laws with Galileo's mechanics, let him write a single system of the world.","before":"Galileo and Kepler had already challenged old astronomy, but there was still no quantitative theory of motion and gravity that united earth and sky.","after":"The Principia became the foundation of classical physics and a model of what a scientific theory could be."},"Industrial Revolution":{"possible":"Britain had coal, capital, colonial markets, and inventors who could put steam and new machines to work in textiles and mining.","before":"Most goods were made by hand in homes and workshops, and muscle, water, and wood were the main sources of power.","after":"Factories, railroads, and urban life remade societies, multiplied energy use, and began the fossil-fueled world we still inhabit."},"First powered flight":{"possible":"The Wrights combined a light gasoline engine, careful wing data from their own wind-tunnel tests, and a method of three-axis control.","before":"People could glide in gliders or rise in balloons, but no machine had yet taken off under its own power and flown with a pilot.","after":"Powered flight shrank the planet, transformed war, and opened the path to airlines and, later, spacecraft."},"World War II":{"possible":"Nazi Germany's invasion of Poland, after years of rearmament and appeasement, triggered a conflict that alliances and ideology then globalized.","before":"A fragile, vengeful peace after World War I, the rise of fascist and militarist regimes, and unresolved grievances left the world primed for a larger war.","after":"Tens of millions were dead, Europe and East Asia were wrecked, the atomic age had begun, and a bipolar Cold War followed."},"Sputnik 1":{"possible":"Soviet rocketry, rooted in intercontinental missile development and a team led by Sergei Korolev, could lift a simple beeping sphere into orbit.","before":"The sky was empty of human-made satellites; space was a realm of science fiction and high-altitude research, not orbiting machines.","after":"The Space Age began, the United States raced to respond, and satellites soon remade science, communications, and intelligence."},"Moon landing":{"possible":"A decade of NASA's Apollo program — from Saturn V rockets to lunar modules and a political commitment after Sputnik — made a landing feasible.","before":"Humans had sent probes and flown in Earth orbit, but no person had yet set foot on another world.","after":"Armstrong and Aldrin's walk proved that people could reach the Moon, a feat still unmatched for human deep-space travel, and it left a lasting cultural mark."},"Fall of the Berlin Wall":{"possible":"Mass protest in East Germany, a loosened Soviet grip under Gorbachev, and a bungled announcement on travel rules brought crowds to the checkpoints.","before":"For decades Berlin, and Europe, had been split by the Cold War; a concrete wall had sealed East from West since 1961.","after":"The wall was opened and soon torn down; within two years Germany was reunited and the Soviet bloc collapsed."},"World Wide Web":{"possible":"Tim Berners-Lee, at CERN, designed HTTP, HTML, and URLs, then released the first website and browser tools to the public.","before":"The internet already connected researchers, but documents, links, and browsers were not yet a single easy system for everyone.","after":"The Web became the world's main way to publish and find information, founding the modern internet economy and public square."},"Smartphones":{"possible":"Miniaturized chips, capacitive touchscreens, mobile internet, and Apple's design of a full multi-touch interface came together in the first iPhone.","before":"Mobile phones could call and text, and some handheld computers existed, but a true computer in your pocket, built around a touch screen and apps, had not yet arrived for the mass market.","after":"Smartphones became the world's dominant computer, remaking social life, photography, commerce, and the news."},"Protestant Reformation":{"possible":"Luther's theological crisis over indulgences, the power of the new printing press, and a divided German politics let his protest spread faster than earlier reform movements.","before":"Western Christianity was still, in principle, a single Catholic church in Latin Europe, though critics had long challenged its practices.","after":"Western Christendom split; Protestant churches formed, religious wars followed, and literacy and individual reading of scripture gained new force."},"First circumnavigation":{"possible":"Spanish backing, Magellan's determination to find a western way to the Indies, and a surviving crew under Elcano kept one ship going westward until it reached home.","before":"No expedition had yet sailed all the way around the globe; the Earth's size and the Pacific's span were still poorly known to Europeans.","after":"The voyage proved in practice that the oceans connected a round Earth, and it widened Europe's map of the Pacific and the world's scale."},"Galileo's telescope":{"possible":"News of Dutch spyglasses reached Galileo, who ground better lenses, pointed the tube upward, and recorded what he saw with a trained, mathematical eye.","before":"The night sky was known only to the naked eye; planets were wandering points, and the Moon a smooth or imperfect disk in old theory.","after":"Mountains on the Moon and satellites around Jupiter struck at the old cosmos, and telescopic astronomy began."},"Declaration of Independence":{"possible":"A year of war, Thomas Paine's arguments, and a committee's draft — chiefly Jefferson's — gave the Continental Congress a text it could adopt on July 4.","before":"The thirteen colonies were already in armed revolt, but they were still, in law and in much of their own language, subjects of the British crown.","after":"A new republic was proclaimed; its language of rights and popular sovereignty would inspire independence and reform movements far beyond America."},"French Revolution":{"possible":"A bankrupt state, a newly convened Estates-General, food shortages, and political clubs in Paris made a popular rising against the Bastille both possible and explosive.","before":"France was an absolute monarchy in fiscal crisis, with Enlightenment ideas in the air but the Bastille still a royal prison and symbol of arbitrary power.","after":"The revolution overthrew the monarchy, proclaimed the rights of citizens, and then passed through terror, war, and Napoleon, spreading its ideas across Europe."},"Smallpox vaccine":{"possible":"Jenner, a country doctor, tested the folk observation that cowpox seemed to protect milkmaids, and he inoculated a boy with cowpox and then with smallpox.","before":"Smallpox routinely killed and disfigured millions; older inoculation with live smallpox itself was risky and not yet a true vaccine.","after":"Vaccination spread worldwide and, in the twentieth century, led to the only human disease ever eradicated."},"Origin of Species":{"possible":"Darwin's years on the Beagle, his study of breeding and of Malthus, and a vast store of notes let him argue that natural selection shapes life.","before":"Naturalists already knew species varied and the Earth was old, but they lacked a convincing, evidence-rich mechanism for how new species arise.","after":"Evolution by natural selection became the organizing idea of biology, transforming science and public debate."},"Electric light":{"possible":"Edison and his laboratory tested materials systematically until a carbon filament in a better vacuum could glow for many hours, and they designed a system to generate and distribute current.","before":"Night was lit by candles, oil, and gas; electric lamps existed in laboratories and as brief demonstrations, but they were not yet practical and lasting.","after":"Electric lighting spread through cities, extended the working and social day, and helped make electrification the norm."},"Theory of relativity":{"possible":"Einstein asked what it would mean if the speed of light were the same for every observer, and he rebuilt space, time, and energy on that premise.","before":"Physics still treated space and time as a fixed stage, and Maxwell's light-speed and Newton's mechanics sat uneasily together.","after":"Special relativity, and a decade later general relativity, remade physics, paved the way for nuclear energy and GPS, and changed the picture of the cosmos."},"World War I":{"possible":"The assassination of Archduke Franz Ferdinand triggered alliance commitments, mobilization timetables, and nationalist will that statesmen could not, or would not, stop.","before":"Europe's great powers were armed, allied, and tense, especially after the Balkan wars, but a general war among them had been avoided for a century.","after":"Empires fell, borders were redrawn, millions were dead, and the unsettled peace helped set the stage for fascism and a second world war."},"Penicillin":{"possible":"Fleming noticed that a mold, Penicillium, had killed bacteria on a culture plate, and he published the finding that later teams turned into a usable drug.","before":"Bacterial infections were often death sentences; medicine had antiseptics but no drug that could reliably kill bacteria inside the body.","after":"Antibiotics revolutionized medicine, saving countless lives, even as resistance later became a new threat."},"First nuclear weapon":{"possible":"The Manhattan Project gathered fissile material, explosive lenses, and a test site in the New Mexico desert for a plutonium implosion device.","before":"Physicists knew fission could release enormous energy, and wartime labs were racing, but no nuclear explosion had yet been produced.","after":"The atomic age began; bombs were used on Hiroshima and Nagasaki weeks later, and nuclear weapons and power have shadowed world politics ever since."},"DNA double helix":{"possible":"X-ray images by Rosalind Franklin and Maurice Wilkins, and model-building by Watson and Crick, revealed a double helix with paired bases.","before":"Scientists knew DNA carried genetic information, but they did not know how the molecule was built or how it could copy itself.","after":"The structure explained heredity and launched molecular biology, from the genetic code to genetic engineering."},"Human Genome Project":{"possible":"Two decades of international collaboration, automated sequencing, and computational assembly — a public consortium and, in parallel, Celera — brought the project to a finish.","before":"The outlines of human genetics were known, but no nearly complete sequence of our DNA yet existed.","after":"A reference human genome opened modern genomics: disease research, ancestry tests, and the later era of cheap sequencing and gene editing."},"Jamestown founded":{"possible":"A joint-stock company, the promise of profit, and a defensible river site in Virginia let a fragile English party hang on through disease and conflict.","before":"Spanish and other European powers had already planted themselves in the Americas, but England had not yet established a lasting colony on the mid-Atlantic coast.","after":"Jamestown survived to become the seed of English North America, with lasting consequences for Indigenous peoples, slavery, and the later United States."},"Watt's steam engine":{"possible":"Watt's separate condenser, and later rotary motion, made steam far more efficient and adaptable, at a moment when British industry needed power.","before":"Early steam engines such as Newcomen's could pump mines, but they were hungry for fuel and not yet versatile prime movers for factories and wheels.","after":"Improved steam engines drove mills, locomotives, and ships, becoming the hallmark machines of the Industrial Revolution."},"Louisiana Purchase":{"possible":"Napoleon, short of money and abandoning a North American empire after the Haitian Revolution, offered the territory for sale; Jefferson's envoys bought it.","before":"The young United States was a narrow strip along the Atlantic, with France holding a vast claim west of the Mississippi.","after":"The United States roughly doubled in size overnight, opening a continental expansion that would remake the interior — at great cost to Native nations."},"First public railway":{"possible":"British mining railways, Stephenson's locomotives, and a charter to carry coal from the Durham coalfield to the port at Stockton came together in 1825.","before":"Goods and people still moved by wagon, canal, and horse; steam locomotives existed as experiments, but no public railway yet ran them as a regular service.","after":"The railway age began; within decades tracks would span countries and continents and reorder time, trade, and everyday life."},"Telegraph":{"possible":"Morse and others learned to send pulsed electric current along a wire as a code, and a government-backed line was strung from Washington to Baltimore.","before":"Long-distance news moved only as fast as a horse, ship, or train; no message could cross a country in an instant.","after":"The telegraph knit markets, newspapers, and empires together, and it set the pattern for all later electrical communication."},"ChatGPT":{"possible":"Large language models trained on vast amounts of text, a simple chat interface, and OpenAI's decision to release a public preview made the leap feel sudden.","before":"Machine-learning models could already write and classify text, but they were not yet a simple, worldwide conversation partner in a chat box.","after":"Generative AI entered everyday work and culture almost overnight, setting off a global race to build, regulate, and live with these systems."}};
