const STORY={"Big Bang":{"possible":"A patch of extreme energy can inflate, then expand and cool—the first beginning physics can still describe.","before":"There is no place, no clock, no atom. Only a state hotter and denser than anything that would follow.","after":"In a fraction of a second the cosmos inflates, then cools enough for the first particles, light, and—eons later—atoms to form."},"First stars":{"possible":"Tiny ripples left from the early universe grow under gravity until collapsing clouds reach the temperature of nuclear fusion.","before":"For hundreds of millions of years the cosmos is a dark, cooling fog of hydrogen and helium, without a single star.","after":"The first stars punch holes in the darkness and begin cooking the heavier elements later worlds will need."},"Milky Way forms":{"possible":"Gravity draws gas, dark matter, and early stars into a growing clump in what will become the Local Group.","before":"Other galaxies already glow across the young universe, but ours is still scattered fragments—no spiral, no hub, no Milky Way.","after":"Those first fragments grow into the galaxy that will one day cradle the Sun and Earth."},"First supernovae":{"possible":"Those first stars are massive and short-lived; when their fuel runs out, their cores collapse and detonate at temperatures that can forge elements heavier than helium.","before":"The cosmos is still a diet of hydrogen and helium—no carbon for chemistry, no oxygen, no iron for later worlds.","after":"The wreckage of dead stars becomes the raw material of planets, and of us."},"First galaxies":{"possible":"Dark matter scaffolds the early universe, pulling gas and stars into collapsing overdensities left from the Big Bang.","before":"Stars shine, but they still roam in loose swarms, not yet packed into the great star-cities we call galaxies.","after":"Galaxies become the factories of star formation, colliding and growing for the rest of cosmic time."},"Reionization":{"possible":"Enough young stars and galaxies finally pour out the ultraviolet light needed to ionize the hydrogen fog between them.","before":"After the first atoms form, a long dark age settles in: intergalactic hydrogen stays neutral, and much of the universe stays opaque.","after":"The space between galaxies turns transparent; the cosmos becomes the clear, ionized expanse we still observe."},"Andromeda forms":{"possible":"The same gravitational pile-up that built the young Milky Way is at work in a neighboring clump of matter.","before":"Small galaxies are already growing, including our own ancestors, but Andromeda—the future giant next door—does not yet exist.","after":"Andromeda becomes the Local Group's heavyweight, now on a slow collision course with the Milky Way."},"Peak star formation":{"possible":"Rich reserves of cold gas and frequent galaxy collisions create the perfect conditions for a universal burst of star formation.","before":"For billions of years, star formation has been climbing as galaxies collide and gas remains plentiful.","after":"From this noon the universe slowly dims: gas is used up or heated, and star birth declines toward the quieter cosmos we inhabit."},"Sun forms":{"possible":"A shock—perhaps from a nearby supernova—helps a cold molecular cloud collapse until a dense core reaches fusion.","before":"In a spiral arm of the Milky Way, a dark, metal-rich cloud drifts, still without a star of our own.","after":"The new Sun lights a swirling disk of leftovers, the construction yard of Earth and the other planets."},"Earth forms":{"possible":"In the protoplanetary disk, dust grains cling together, then snowball under gravity into planetesimals and a planet.","before":"A whirl of leftover gas, ice, and rock still circles the infant Sun—no finished Earth among it.","after":"A molten proto-Earth stands ready for a last, brutal collision that will give it a moon."},"The Moon forms":{"possible":"The inner solar system is still crowded with leftover protoplanets, and one of them, Theia, is on a collision course with Earth.","before":"Earth is growing, but it has no large moon and is still taking blows from leftover planetary bodies.","after":"The impact resets Earth's spin and interior; the Moon that forms will stabilize our tilt and drive the tides."},"Oldest zircons":{"possible":"As pockets of crust finally cool, zirconium-rich melts crystallize into grains tough enough to outlast almost everything else.","before":"Earth's first crust is melted and remade again and again; almost no original surface survives.","after":"Those hardy crystals become our oldest clocks for Earth's crust, and they hint that liquid water may already have been present."},"First oceans":{"possible":"Once the surface is cool enough, a steam atmosphere condenses, fed by water from the planet's interior and from icy impactors.","before":"The young Earth is a furnace of magma and steam, too hot for lasting seas.","after":"Oceans become the laboratory where chemistry will, in time, invent life—and they have ruled climate and geology ever since."},"Late Heavy Bombardment":{"possible":"A reshuffling of the giant planets is thought to have flung leftover asteroids and comets inward, into the paths of the rocky worlds.","before":"The planets are built, but the solar system is still a shooting gallery of leftover debris and shifting giant-planet orbits.","after":"The Moon's great basins are gouged out, and Earth is resurfaced; whether the barrage helped or nearly erased early life is still argued."},"Great Oxygenation":{"possible":"Cyanobacteria invent oxygenic photosynthesis and, over vast stretches of time, pump out oxygen faster than rocks and iron can soak it up.","before":"Earth's air is almost oxygen-free. Microbes have thrived for ages, but the atmosphere would kill the animals of later eons.","after":"The world turns oxidizing. Anaerobic life is pushed to the margins, and—after a long delay—complex, oxygen-breathing life becomes possible."},"Rodinia":{"possible":"Drifting cratons collide over hundreds of millions of years until nearly all the planet's crust is bunched together.","before":"Earth's continents are scattered; no single landmass yet hoards most of the planet's crust.","after":"The assembled giant rewires ocean currents and climate; when it later rips apart, it redraws the oceans that animals will inherit."},"Snowball Earth":{"possible":"Silicate weathering, a shifting layout of continents, and ice that reflects still more sunlight let glaciers run away from the poles to the tropics.","before":"The continents sit in a pattern that leaves a cooling climate one push away from runaway ice.","after":"The planet is twice entombed in ice; when the thaws finally come, a shaken biosphere has room for the first large animals."},"Pangaea":{"possible":"Collisions, including the joining of Gondwana and Laurussia, suture the landmasses into a single whole.","before":"In the late Paleozoic, separate continents still ring a shrinking ocean, not yet one world of stone.","after":"Pangaea's vast interior turns arid, the oceans reroute—and when the supercontinent later splits, it will open the Atlantic and carve the map we know."},"Himalayas begin":{"possible":"Mantle convection drives the Indian plate north across the Tethys until it can no longer go around Eurasia.","before":"India is still an island continent, adrift after leaving Gondwana; the highest mountains on Earth do not yet exist.","after":"The rising Himalayas and Tibetan Plateau remake Asia's climate, turbocharge the monsoons, and are still growing today."},"First life":{"possible":"In hot, molecule-rich places—hydrothermal vents, tide pools, or mineral surfaces—chemistry can assemble self-copying, membrane-wrapped systems.","before":"Earth has water, energy, and organic molecules, but nothing yet that can be called alive.","after":"Life, once started, spreads through the seas and begins to rewrite the planet itself."},"Stromatolites":{"possible":"Communities of microbes, including early photosynthetic bacteria, bind layer upon layer of mud in the shallows.","before":"Life is already here, but it leaves almost no durable structures in the rock.","after":"Stromatolites become some of the oldest unambiguous fossils of life; in a few sheltered waters, they still grow."},"Eukaryotes":{"possible":"In a world slowly filling with oxygen, one cell swallows another—likely an archaeon engulfing a bacterium—and the guest becomes the mitochondrion.","before":"For more than a billion years, life is prokaryotic: no nucleus, no internal compartments, no path yet to plants or animals.","after":"Eukaryotic cells can grow larger and more complex; every organism with a nucleus is their descendant."},"Multicellular life":{"possible":"Cells that stay stuck together after dividing, and start to specialize, can build simple tissues—a step red algae take early.","before":"Eukaryotic cells live as loners; nothing like a true plant or animal body exists.","after":"Once cells cooperate, larger bodies and organs become possible—and the visible living world can begin."},"Ediacaran biota":{"possible":"After Snowball Earth, a milder climate, more oxygen, and evolving animal lineages let soft, larger bodies take form.","before":"The oceans still belong to microbes and algae; large animals have left almost no mark.","after":"These strange pioneers hint at the explosion of body plans about to hit in the Cambrian."},"Cambrian explosion":{"possible":"A genetic toolkit for building bodies, rising oxygen, and an arms race between hunter and hunted favor rapid experiments in form.","before":"Life in the oceans is real but still short on hard shells and familiar anatomies; the Ediacaran world is fading.","after":"Most major animal phyla appear in the fossil record, and the seas become a battlefield of mineralized skeletons."},"First vertebrates":{"possible":"A notochord, then a backbone, gives swimming animals a stiff but flexible rod—an edge in open water.","before":"The early seas already hold arthropods and many soft-bodied creatures, but nothing yet with a spine.","after":"Those jawless swimmers found the line that will lead to sharks, tetrapods, and us."},"First land plants":{"possible":"Freshwater green algae evolve ways not to dry out—spores, cuticle-like coatings—and can colonize wet margins of lakes and rivers.","before":"The continents are rock, dust, and microbial slime; plants still live only in water.","after":"Vegetation slowly carpets the land, manufactures the first soils, and invites animals to follow."},"First tetrapods":{"possible":"Lobe-finned fishes in shallow, plant-choked waters evolve sturdy, jointed fins and lungs that can handle brief trips into air and mud.","before":"Backboned animals are still swimmers; fins and gills rule, and dry land belongs to plants and arthropods.","after":"Tetrapods inherit the continents. Their descendants will be amphibians, reptiles, birds, and mammals."},"Great Dying":{"possible":"The Siberian Traps erupt on a colossal scale, dumping lava, greenhouse gases, and toxins until climate and the oceans collapse.","before":"The late Permian is already feverish and low on oxygen, but life is still abundant on land and in the seas.","after":"Most species are gone. From the survivors, ecosystems must be rebuilt—and the emptied world makes room for dinosaurs, then mammals."},"First dinosaurs":{"possible":"Archosaur reptiles evolve upright limbs and new ways of moving and feeding in the open landscapes left after the Great Dying.","before":"The early Triassic is a thin, recovering world of modest reptiles and emptied niches.","after":"Dinosaurs spread and diversify until they are the dominant large animals on land."},"First mammals":{"possible":"Small cynodonts evolve differentiated teeth, warmer bodies, and jaws that will become the middle ear—the hallmarks of mammals.","before":"Mammal ancestors are still synapsid forerunners, sharing a Triassic world where dinosaurs are on the rise.","after":"Early mammals stay mostly small and nocturnal through the dinosaur age, then explode in diversity once the giants are gone."},"First flowering plants":{"possible":"A new plant lineage invents the flower, a more efficient way to reproduce and to recruit insects as partners.","before":"Mesozoic landscapes are already green with ferns, conifers, and cycads, but there are no flowers and no true fruits.","after":"Angiosperms take over forests, grasslands, and food webs; today they dominate most plant life on land."},"Dinosaur extinction":{"possible":"A mountain-sized rock strikes what is now the Yucatán; fire, darkness, and climate shock do the killing.","before":"Dinosaurs still rule a lush Late Cretaceous world of plants, animals, and shallow seas that looks built to last.","after":"The non-avian dinosaurs are gone. Mammals, birds, and a shattered biosphere inherit the Earth."},"First primates":{"possible":"Small, tree-and-insect-hunting mammals already have grasping hands, forward-facing eyes, and flexible brains—the starter kit of a primate.","before":"The post-impact world is open and warming, with many daytime niches left vacant by dinosaurs.","after":"Primates spread through the trees; much later, one African branch will lead to the hominins—and to us."},"First hominins":{"possible":"Climate swings that break up the forests, plus an ape body already good at climbing and grasping, favor experiments in walking upright in mixed woodland.","before":"African forests are full of apes, but none yet walk habitually on two legs or stand on the human line.","after":"The hominin family peels away from the other apes and starts the long road toward upright walking, tools, and our species."},"Australopithecus afarensis":{"possible":"A shifting patchwork of woodland and savanna in East Africa favors creatures that can walk on two legs and still climb.","before":"Earlier apes and the first hominins have started to walk more upright, but this iconic bipedal species of East Africa has not yet appeared.","after":"A. afarensis and its kin prove that upright walking was locked in millions of years before big brains or stone tools."},"Laetoli footprints":{"possible":"A volcanic eruption lays down a wet ash layer, and hominins cross it before it hardens into stone.","before":"Bones already hinted at upright walking, but no one had yet caught the stride itself so clearly in the act.","after":"The tracks remain among the most vivid proof that our ancestors walked upright by 3.66 million years ago."},"First stone tools":{"possible":"Hands freed from walking, and the need to butcher and pound food, lead some hominins to strike rock on rock.","before":"Hominins walk upright and use whatever they find, but regular toolmaking has not yet left a clear stone trail.","after":"A technological path begins that will run, through later industries, all the way to every tool we make."},"Lucy":{"possible":"A species already built for walking on the ground, yet still at home in trees, can thrive in Ethiopia's patchwork of woods and grass.","before":"East African woodlands and grasslands are already walked by Australopithecus afarensis, a small-bodied, upright hominin.","after":"Fossils like Lucy's later let us see that body in detail; her kind lives on for a time and will share the land with later toolmakers."},"Genus Homo emerges":{"possible":"A changing climate and a shift toward more tools, meat, and brainpower produce a slightly larger-brained, more versatile kind of hominin.","before":"Africa's hominin family is still dominated by australopiths with small brains and ape-like faces—not yet our own genus.","after":"Homo will spread across Africa and then out of it, giving rise to erectus, sapiens, and our extinct cousins."},"Oldowan tools":{"possible":"Early Homo and late australopiths learn a repeatable craft: strike a sharp flake from a pebble core.","before":"A few older tools exist at Lomekwi, but a lasting, widespread stone-tool culture has not yet taken hold.","after":"Oldowan flakes let hominins butcher meat, crack bone, and process plants far more efficiently—and the recipe travels."},"Homo habilis":{"possible":"A diet richer in meat and marrow, plus daily tool use, favors individuals with nimbler hands and bigger brains.","before":"Early Homo is only just appearing; a distinctly handy, larger-brained species is not yet clear in the record.","after":"Homo habilis and its kin show the first well-known pairing of a bigger brain with everyday tools—a step toward later Homo."},"Homo erectus":{"possible":"In African populations that rely more on tools and meat, larger bodies, bigger brains, and a commitment to endurance walking take hold.","before":"Earlier Homo and australopiths are still relatively small, with climbing-ready proportions and limited range.","after":"Homo erectus can roam far. It will become the first human species to leave Africa and will endure for well over a million years."},"First out of Africa":{"possible":"With long legs, stone tools, and flexible diets, Homo erectus can follow game and new habitats out of Africa and across the Levant.","before":"Every earlier chapter of human evolution has unfolded in Africa; the rest of the Old World is still empty of people.","after":"Humans become a multi-continental genus, reaching the Caucasus, East Asia, and eventually Java."},"Acheulean hand axes":{"possible":"Toolmakers learn to flake a cobble into a planned, symmetrical axe they can make again and again.","before":"Oldowan tools are sharp flakes and cores, effective but rarely shaped to a standard design.","after":"The Acheulean spreads for more than a million years and becomes the signature technology of Homo erectus."},"Controlled fire":{"possible":"Repeated use of hearths, hinted at Wonderwerk and later camps, lets some groups capture, tend, and finally make fire.","before":"Hominins surely knew wildfire, but they have not yet been shown to keep or kindle it at will.","after":"Fire means warmth, protection, light, and cooked food—new diets, new climates, and evenings that can last after dark."},"Homo heidelbergensis":{"possible":"African and Eurasian populations of later Homo evolve larger brains and more modern skeletons, often grouped as Homo heidelbergensis or close kin.","before":"Homo erectus has long been the main human of the Old World; the ancestors of sapiens and Neanderthals are not yet a distinct later form.","after":"This paleospecies is widely seen as the root from which modern humans, Neanderthals, and Denisovans later split."},"Neanderthals and Denisovans":{"possible":"Groups that push into colder Eurasia become isolated enough, over many thousands of years, to evolve on their own paths.","before":"Late Homo is still a loosely connected family; Neanderthals and Denisovans do not yet exist as separate peoples.","after":"Neanderthals will inhabit Europe and western Asia, Denisovans the east—and both will later meet, and mix with, incoming Homo sapiens."},"Homo sapiens":{"possible":"In African populations already large-brained, anatomy we would recognize as our own takes shape.","before":"Africa is home to earlier forms of Homo—more robust faces, somewhat smaller brains—but not yet to people like us.","after":"Homo sapiens will, in time, walk every continent and become the last surviving human species."},"Out of Africa":{"possible":"A later African population, armed with new skills and helped by climate windows, expands through the Near East and along Asia's southern coasts.","before":"Modern humans have lived in Africa for well over 100,000 years, with only limited earlier ventures beyond it; most of the globe is still without us.","after":"Their descendants will people Eurasia, Australia, and eventually the Americas, meeting Neanderthals and Denisovans along the way."},"Cave art":{"possible":"Fully modern minds, mineral pigments, firelight, and the shelter of caves let artists fix images in place.","before":"People already make tools, ornaments, and almost certainly music and stories, but little painted imagery has yet been left on cave walls.","after":"Cave art remains among the earliest surviving windows into human imagination and symbolic life."},"Lascaux":{"possible":"Magdalenian communities in the Dordogne have the skill, the pigments, and a reason—ritual, story, or both—to decorate a limestone cave's deep chambers.","before":"Ice Age Europe already has a painting tradition, from earlier sites such as Chauvet, but Lascaux's halls have not yet been made.","after":"The Hall of the Bulls and its companions become, thousands of years later, among the most famous images of the Paleolithic world."},"First Humans in the Americas":{"possible":"Falling seas expose the Bering land bridge, and people already living in Siberia can move east, then south along the coast or through gaps in the ice.","before":"The Americas are still empty of people, cut off by ice and ocean from the peopled Old World.","after":"Within a few thousand years, humans have spread from the Arctic to Tierra del Fuego, founding every later Indigenous society of the continents."},"Dogs domesticated":{"possible":"Tamer wolves that hang around camps, or pups raised by hunters, are selected, generation by generation, for closeness to people.","before":"People hunt, scavenge, and sometimes share ground with wolves, but no animal yet lives as a true companion.","after":"The dog becomes the first domesticated animal—partner in the hunt, at the campfire, and, much later, in herding and friendship."},"End of the Ice Age":{"possible":"Shifts in Earth's orbit and a rise in greenhouse gases bring a warming the great ice sheets cannot survive.","before":"For tens of thousands of years, ice smothers much of the north, and climate lashes between harsh Pleistocene extremes.","after":"A relatively stable warmth settles in, and in that calm, farming, villages, and civilizations become possible."},"Göbekli Tepe":{"possible":"A rich post-glacial landscape of wild cereals and game can support large seasonal gatherings, and skilled carvers can raise T-shaped pillars in circles.","before":"People in the Fertile Crescent still hunt and gather; they are not farmers yet, but they can already organize ambitious gatherings.","after":"Göbekli Tepe proves that monumental ritual architecture can come before village farming, upending older stories of how civilization began."},"First farming":{"possible":"Naturally large-seeded grasses, a warming Holocene, and communities already lingering in one place make sowing and harvest worth the trouble.","before":"People gather wild wheat and barley but do not yet live by the crop; food still comes from the hunt and the forage.","after":"Farming will be invented in other cradles too, feeding denser populations, surplus stores, and, in time, the first cities."},"Goats and sheep domesticated":{"possible":"Wild goats and sheep in the Zagros and nearby highlands are social enough to manage, and settled farmers want meat that does not have to be hunted.","before":"Early cultivators still depend heavily on the hunt; no herd animal yet lives under human control.","after":"Livestock become the second pillar of farming life—meat, milk, hides, and later wool."},"Jericho's walls":{"possible":"A rich oasis, a growing population, and a need for defense or display make a massive stone wall and tower worth the labor.","before":"Some communities in the Jordan Valley already live year-round, but none has yet wrapped a town in a great wall and tower.","after":"Jericho stands among the first true towns, proof that village life is putting down permanent roots."},"Rice farming":{"possible":"Wild rice already grows in the Yangtze wetlands, and communities with pottery and riverside settlements can start planting and selecting it.","before":"In the Yangtze basin, people forage wild rice and other wetland plants; they are not yet full farmers.","after":"Rice farming spreads through East and Southeast Asia and becomes one of the pillars of the world's food supply."},"Maize domesticated":{"possible":"Generation after generation, people in Mexico select teosinte for larger cobs and kernels until a grassy weed becomes maize.","before":"In Mesoamerica, people hunt and gather, including a wild grass—teosinte—with only tiny ears.","after":"Maize spreads across the Americas and, much later, the world, a crop that can feed cities and states."},"Horses and the plow":{"possible":"Wild horses of the Eurasian steppe can be tamed for riding and draft, while heavier plows can turn more earth than a hoe ever could.","before":"Farming is established in the Near East, but fields are still worked by hand, and muscle on the road is still human or ox—not yet the horse.","after":"The plow opens more land, and the horse will later remake travel, herding, and warfare across Eurasia."},"Uruk":{"possible":"Irrigation on the Euphrates, growing trade, and temple bureaucracy can support a dense population and specialist crafts.","before":"Mesopotamia has villages and temples, but no settlement has yet reached the scale or complexity of a true city.","after":"Uruk becomes the template of urban life—and writing, monumental building, and the state are close behind."},"Cuneiform writing":{"possible":"Temple and palace economies need to track grain, labor, and offerings, and scribes start pressing signs into wet clay.","before":"Memory is oral; tokens and seals can mark goods, but no script yet captures language itself.","after":"Bookkeeping grows into a full script for law, letters, literature, and history—the beginning of the written record."},"Egypt unified":{"possible":"A shared river, growing trade, and ambitious southern rulers supply the means to conquer—and then govern—the entire Nile Valley.","before":"The Nile holds distinct cultures in Upper and Lower Egypt, not yet one kingdom.","after":"The pharaonic state will last, in changing forms, for three millennia, leaving the temples, tombs, and writing of ancient Egypt."},"Bronze Age":{"possible":"Smiths learn that copper alloyed with tin makes a harder metal, and long-distance trade can bring the two together.","before":"Tools and weapons are still stone, copper, or wood; metal is known, but it is soft.","after":"Bronze arms palaces and armies, and the economies of the Near East and Mediterranean grow more tightly bound—and more fragile."},"Great Pyramid of Giza":{"possible":"A centralized state, surplus grain, master organizers, and generations of practice in stone make a 146-meter royal tomb possible.","before":"Egypt's Old Kingdom already raises great tombs, but nothing on Earth has yet reached the scale of Khufu's pyramid.","after":"The Great Pyramid stands as the ancient world's most massive monument and the emblem of Old Kingdom power."},"First burials":{"possible":"Modern humans—and perhaps earlier kin—with symbolic minds begin placing the dead in prepared graves, sometimes with ochre and offerings.","before":"People care for the dead and sometimes cache bodies, but clear, repeated burial with grave goods is not yet well attested.","after":"Burial becomes a widespread human practice: a mark of ritual, memory, and ideas about death."},"Shell beads":{"possible":"At Blombos and nearby sites, people collect tick shells, pierce them, and string them as beads.","before":"People already use ochre and tools, but durable personal ornaments are still rare in the archaeological record.","after":"Jewelry and other ornaments spread as some of the earliest clear signs of identity, status, and symbolic culture."},"Toba eruption":{"possible":"Toba's huge magma chamber blows in a catastrophic eruption, sending ash across much of the tropics.","before":"People and other hominins are already widespread in Africa and Eurasia, living through ordinary climate swings—not a super-eruption.","after":"A volcanic winter follows. How badly it cut human numbers is still argued, but the ash remains a global time stamp."},"Neanderthal extinction":{"possible":"Climate stress, small populations, and competition or absorption by expanding modern humans likely push Neanderthals to the brink.","before":"For hundreds of thousands of years, Neanderthals have shared Eurasia with other humans and, late on, with incoming Homo sapiens.","after":"Their distinctive fossils cease. Our species remains, carrying a little Neanderthal DNA in people outside Africa."},"First pottery":{"possible":"In a rich but cold late Pleistocene, East Asian foragers discover that clay hardens in fire into waterproof vessels.","before":"People cook in pits and skins; no fired clay vessel has yet appeared in the archaeological record.","after":"Pottery spreads, and much later it becomes essential to farming life for storage, cooking, and fermentation."},"The wheel":{"possible":"Mesopotamian potters develop a fast-spinning wheel, and the same rotating disk is soon fitted to carts.","before":"Heavy loads are dragged, carried, or floated; potters shape clay by hand; no wheeled vehicle exists.","after":"The potter's wheel and the wagon spread, remaking crafts, trade, and—once hitched to animals—overland travel."},"Code of Hammurabi":{"possible":"A strong Babylonian king, a mature cuneiform legal tradition, and a wish to display justice lead Hammurabi to carve his judgments in stone.","before":"Mesopotamian cities already have kings and customs, but no comparably complete law code has yet been raised as a public monument.","after":"The code shapes how later societies think about law, and it remains a foundation stone of legal history."},"Iron Age":{"possible":"Artisans learn to smelt and work iron—a far commoner ore than tin-bronze—just as Bronze Age palace systems in the eastern Mediterranean come under stress.","before":"Bronze still rules elite weapons and tools, but it depends on scarce tin and fragile long-distance trade.","after":"Iron tools and weapons spread widely, arming new states and putting metal into more hands than bronze ever reached."},"Athenian democracy":{"possible":"Crisis, reform-minded leaders, and a culture of public argument let Cleisthenes reorganize the citizenry into assemblies and offices.","before":"Athens is an aristocratic city-state; power sits with noble families, not a broad citizen body.","after":"Athenian democracy, however limited by later standards, becomes a reference point for republican and democratic thought for millennia."},"Alexander the Great":{"possible":"Philip and Alexander's professional army, cavalry, and siege engines, plus a Persia already strained, make a lightning conquest possible.","before":"The Persian Empire stretches from the Aegean to India; the Greek world is a patchwork of city-states, with Macedon newly first among them.","after":"Greek language and culture spread across the Near East in the Hellenistic age, a blend that will shape the Mediterranean for centuries."},"Silk Road":{"possible":"After the Han push into Central Asia, caravans can move more safely from oasis to oasis, carrying silk, horses, and ideas.","before":"China, Central Asia, India, and the Mediterranean trade only in relays; no regular corridor has yet been opened from the east.","after":"The Silk Road ties East to West for centuries, moving goods, technologies, religions—and disease."},"Birth of Jesus":{"possible":"A Jewish world of scripture, prophecy, and messianic hope, already in contact with Greek and Roman culture, is the setting for Jesus's birth and later teaching.","before":"Judea is a Roman client region of Second Temple Judaism; a small Jewish population lives under imperial power, and the movement later called Christianity does not yet exist.","after":"His life, crucifixion, and the movement of his followers grow into Christianity, which will become the world's largest religion and remake much of global history."},"Birth of Islam":{"possible":"Muhammad, a merchant of Mecca, experiences a call to prophesy in a society already familiar with monotheism through Judaism and Christianity.","before":"Arabia is a land of trading towns, desert tribes, and older religions; the community of Muslims does not yet exist.","after":"Islam unifies much of Arabia and, within a century, becomes a civilization stretching from Spain to Central Asia."},"Mongol Empire":{"possible":"Temüjin unites the Mongol tribes by alliance and force, then turns unmatched cavalry, discipline, and terror on neighbors already divided.","before":"The Eurasian steppe is a patchwork of rival nomad tribes; no single Mongol power yet spans the grasslands, let alone the continents.","after":"The Mongol Empire, later the largest contiguous land empire, stitches Eurasia together under a peace that is both brutal and, for a time, open to trade."},"Roman Empire":{"possible":"Victory over Antony and Cleopatra, command of the army, and a careful show of restoring the Republic let Octavian accept the title Augustus.","before":"Rome has been a republic torn by civil war. Octavian already holds power in fact, but the old forms have not yet become an empire in name.","after":"The Empire will dominate the Mediterranean for centuries; its law, language, and cities shape Europe, North Africa, and the Near East long after the West falls in 476."},"Magna Carta":{"possible":"Military failure, crushing taxes, and organized baronial resistance corner King John at Runnymede.","before":"English kings claim broad, often arbitrary power, and a battered, overreaching King John faces angry barons with no great charter to bind him.","after":"Magna Carta's claims—that the king is under the law, and that no free man should be punished except by lawful judgment—echo into later constitutional government."},"Black Death":{"possible":"The bacterium Yersinia pestis, riding fleas on rodents, travels Mongol-era trade routes from Central Asia into Mediterranean ports.","before":"Europe is populous and commercially revived, if already strained by a cooler climate and earlier disease—but it has not yet met this plague.","after":"Perhaps a third of Europeans die. Labor grows scarce, society buckles, and the shock remakes medieval economy and faith."},"Printing press":{"possible":"Gutenberg combines movable metal type, a press adapted from existing screw presses, oil-based ink, and a hungry market for cheaper texts.","before":"Books are copied by hand, rare and costly, and literacy belongs mostly to clergy, clerks, and elites.","after":"Printed books multiply, carrying literacy, Reformation, science, and news—and mass communication is born."},"Columbus reaches the Americas":{"possible":"Iberian ships and navigation, a hunt for a westward route to Asia, and Spanish royal backing send Columbus across the Atlantic.","before":"The Americas have been home to Indigenous peoples for thousands of years, but they are unknown to late-medieval Europe; no lasting Atlantic crossing to the Caribbean has yet been made.","after":"His landfall opens a permanent, often catastrophic encounter—the Columbian Exchange of people, crops, silver, and disease."},"Scientific Revolution":{"possible":"Better observations, recovered ancient texts, and a mathematician willing to put the Sun at the center lead Copernicus to publish his model.","before":"European learning still leans on ancient authority; Earth sits, in most minds, at the center of a nested cosmos.","after":"A new habit takes hold: question nature with mathematics and observation. The Scientific Revolution gathers force."},"Newton's Principia":{"possible":"A new mathematics of his own making, plus a synthesis of Kepler's laws and Galileo's mechanics, lets Newton write a single system of the world.","before":"Galileo and Kepler have already cracked the old astronomy, but no one has a quantitative theory of motion and gravity that unites earth and heaven.","after":"The Principia becomes the foundation of classical physics and the model of what a scientific theory can be."},"Industrial Revolution":{"possible":"Britain has coal, capital, colonial markets, and inventors ready to put steam and new machines to work in textiles and mining.","before":"Most goods are still made by hand in homes and workshops; muscle, water, and wood are the main sources of power.","after":"Factories, railroads, and mushrooming cities remake everyday life, burn fossil fuels on a new scale, and invent the industrial world we still inhabit."},"First powered flight":{"possible":"The Wrights combine a light gasoline engine, wing data from their own wind-tunnel tests, and a way to control the aircraft in all three axes.","before":"People can glide, and they can rise in balloons, but no machine has yet taken off under its own power with a pilot aboard.","after":"Powered flight shrinks oceans, remakes war, and makes airlines—and, later, spacecraft—thinkable."},"World War II":{"possible":"Fascist regimes hungry for land, democracies desperate to avoid another war, and a world still bleeding from the last one. Appeasement bought time, but not peace.","before":"World War I, the war to end all wars, ended nothing. Out of a humiliated Germany, a broken economy, and the Great Depression, dictators rise and promise glory through conquest.","after":"Six million Jews murdered in the Holocaust. Two cities erased by atomic bombs. The world splits into two nuclear superpowers, and the United Nations is born so it never happens again."},"Sputnik 1":{"possible":"Soviet rockets, born of intercontinental missile work and a team led by Sergei Korolev, can lift a simple sphere into orbit.","before":"The sky holds no human-made satellites; space is still a province of science fiction and high-altitude research.","after":"The Space Age begins. The United States scrambles to answer, and satellites soon remake science, communications, and intelligence."},"Moon landing":{"possible":"A decade of NASA's Apollo program—Saturn V rockets, a lunar module, and a political vow after Sputnik—makes a landing possible.","before":"Humans have flown in Earth orbit and sent probes ahead, but no person has yet set foot on another world.","after":"Armstrong and Aldrin's walk proves people can reach the Moon, a feat still unmatched in human deep-space travel, and it stamps itself on the century's imagination."},"World Wide Web":{"possible":"At CERN, Berners-Lee designs HTTP, HTML, and URLs, then gives away the first website and browser tools.","before":"The internet already links researchers, but documents, links, and browsers are not yet one simple system for everyone.","after":"The Web becomes the world's main way to publish and find information—and the foundation of the modern internet economy and public square."},"Protestant Reformation":{"possible":"Luther's stand against indulgences, the new printing press, and a divided German politics let his protest spread faster than earlier reform movements.","before":"Western Christianity is still, in principle, one Catholic church in Latin Europe, though critics have long attacked its practices.","after":"Western Christendom splits. Protestant churches form, religious wars follow, and more people begin to read scripture for themselves."},"First circumnavigation":{"possible":"Spanish backing, Magellan's push for a western way to the Indies, and a surviving crew under Elcano keep one ship sailing west until it reaches home.","before":"No expedition has yet sailed all the way around the world; Europeans still badly underestimate the Earth's size and the Pacific's span.","after":"The voyage proves, in practice, that the oceans connect a round Earth, and it stretches Europe's map of the Pacific and the planet."},"Galileo's telescope":{"possible":"Word of Dutch spyglasses reaches Galileo; he grinds better lenses, aims the tube upward, and records what he sees with a mathematician's eye.","before":"The night sky is known only to the naked eye; planets are wandering points, and in old theory the Moon is a smooth or only slightly imperfect disk.","after":"Mountains on the Moon and satellites around Jupiter crack the old cosmos, and telescopic astronomy begins."},"Declaration of Independence":{"possible":"A year of war, Thomas Paine's arguments, and a committee draft—chiefly Jefferson's—give the Continental Congress a text it can adopt on July 4.","before":"The thirteen colonies are already in armed revolt, but in law—and still in much of their own language—they remain subjects of the British crown.","after":"A new republic is proclaimed. Its language of rights and popular sovereignty will inspire independence and reform movements far beyond America."},"French Revolution":{"possible":"A bankrupt state, a newly convened Estates-General, food shortages, and political clubs in Paris make a popular assault on the Bastille both possible and explosive.","before":"France is an absolute monarchy in fiscal free fall, buzzing with Enlightenment ideas, while the Bastille still stands as a royal prison and a symbol of arbitrary power.","after":"The revolution overthrows the monarchy, proclaims the rights of citizens, then passes through terror, war, and Napoleon, carrying its ideas across Europe."},"Smallpox vaccine":{"possible":"Jenner, a country doctor, tests the folk claim that cowpox protects milkmaids, inoculating a boy with cowpox and then with smallpox.","before":"Smallpox routinely kills and disfigures millions; older inoculation with live smallpox itself is risky and is not yet a true vaccine.","after":"Vaccination spreads around the world and, in the twentieth century, leads to the only human disease ever wiped off the Earth."},"Origin of Species":{"possible":"Darwin's years on the Beagle, his study of breeders and of Malthus, and a mountain of notes let him argue that natural selection shapes life.","before":"Naturalists already know that species vary and that the Earth is old, but they lack a convincing, evidence-rich mechanism for how new species arise.","after":"Evolution by natural selection becomes the organizing idea of biology, remaking science and igniting public debate."},"Theory of relativity":{"possible":"Einstein asks what follows if the speed of light is the same for every observer, and he rebuilds space, time, and energy on that single demand.","before":"Physics still treats space and time as a fixed stage; Maxwell's speed of light and Newton's mechanics do not sit comfortably together.","after":"Special relativity—and, a decade later, general relativity—remake physics, make nuclear energy and GPS possible, and change our picture of the cosmos."},"World War I":{"possible":"Railroad mobilization timetables, tangled alliances, and mass-production factories turned one assassination into an unstoppable chain reaction.","before":"Europe felt untouchable—rich, interconnected, and a century past its last continent-wide war—even as rival empires armed to the teeth.","after":"Four empires collapsed, a generation vanished in the mud, and a bitter peace left the fuse burning for World War II."},"Penicillin":{"possible":"Fleming sees that a Penicillium mold has cleared bacteria from a culture plate, and he publishes the finding that later teams will turn into a usable drug.","before":"A bacterial infection is often a death sentence. Medicine has antiseptics, but no drug that can reliably kill bacteria inside the body.","after":"Antibiotics rewrite medicine and save countless lives—even as resistance later rises as a new threat."},"First nuclear weapon":{"possible":"The Manhattan Project assembles fissile material, explosive lenses, and a test site in the New Mexico desert for a plutonium implosion device.","before":"Physicists know fission can unleash enormous energy, and wartime labs are racing, but no nuclear explosion has yet been produced.","after":"The atomic age begins. Weeks later, bombs fall on Hiroshima and Nagasaki, and nuclear weapons and power have shadowed world politics ever since."},"DNA double helix":{"possible":"X-ray images by Rosalind Franklin and Maurice Wilkins, and model-building by Watson and Crick, reveal a double helix with paired bases.","before":"Scientists know DNA carries genetic information, but not how the molecule is built or how it can copy itself.","after":"The structure explains heredity and launches molecular biology, from the genetic code to genetic engineering."},"Human Genome Project":{"possible":"Two decades of international collaboration, automated sequencing, and computational assembly—a public consortium and, in parallel, Celera—bring the project to a close.","before":"The outlines of human genetics are known, but no nearly complete sequence of our DNA yet exists.","after":"A reference human genome opens modern genomics: disease research, ancestry tests, and the later era of cheap sequencing and gene editing."},"Jamestown founded":{"possible":"A joint-stock company, the lure of profit, and a defensible river site in Virginia let a fragile English party hang on through disease and conflict.","before":"Spain and other European powers have already planted themselves in the Americas, but England has not yet established a lasting colony on the mid-Atlantic coast.","after":"Jamestown survives to become the seed of English North America, with lasting consequences for Indigenous peoples, slavery, and the later United States."},"Watt's steam engine":{"possible":"Watt's separate condenser—and later rotary motion—make steam far more efficient and adaptable, just as British industry is hungry for power.","before":"Early engines such as Newcomen's can pump mines, but they gulp fuel and are not yet versatile prime movers for factories and wheels.","after":"Improved steam engines drive mills, locomotives, and ships, becoming the hallmark machines of the Industrial Revolution."},"Louisiana Purchase":{"possible":"Napoleon, short of money and abandoning a North American empire after the Haitian Revolution, offers the territory for sale; Jefferson's envoys buy it.","before":"The young United States is a narrow strip along the Atlantic; France holds a vast claim west of the Mississippi.","after":"The country roughly doubles overnight, opening a continental expansion that will remake the interior—at great cost to Native nations."},"Telegraph":{"possible":"Morse and others learn to send pulsed electric current along a wire as a code, and a government-backed line is strung from Washington to Baltimore.","before":"Long-distance news moves only as fast as a horse, a ship, or a train; no message can cross a country in an instant.","after":"The telegraph knits together markets, newspapers, and empires, and it sets the pattern for every later electrical communication."},"ChatGPT":{"possible":"Large language models trained on oceans of text, a simple chat box, and OpenAI's decision to let the public in make the leap feel sudden.","before":"Machine-learning models can already write and classify text, but they are not yet a simple, worldwide conversation partner in a chat box.","after":"Generative AI walks into everyday work and culture almost overnight, setting off a global race to build, regulate, and live with these systems."}};
